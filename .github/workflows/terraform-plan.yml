name: Terraform Plan

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform-plan.yml'
      - '.github/actions/terraform-init/**'
      - '.github/actions/terraform-quality/**'
      - '.github/actions/terraform-plan/**'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: infrastructure/terraform
  TF_VARS_FILE: environments/uat.tfvars
  TF_STATE_BUCKET: nivasabid-terraform-state

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: terraform-uat

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Configure AWS Credentials
      ####################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      ####################################################################
      # Check Backend
      ####################################################################

      - name: Check Terraform Backend
        id: backend

        shell: bash

        run: |

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" >/dev/null 2>&1
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Terraform backend found."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Terraform backend does not exist."
          fi

      ####################################################################
      # Terraform Init
      ####################################################################

      - name: Terraform Init
        if: steps.backend.outputs.exists == 'true'

        uses: ./.github/actions/terraform-init

        with:
          aws-region: ${{ env.AWS_REGION }}
          working-directory: ${{ env.TF_WORKING_DIR }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      ####################################################################
      # Quality Checks
      ####################################################################

      - name: Terraform Quality
        if: steps.backend.outputs.exists == 'true'

        uses: ./.github/actions/terraform-quality

        with:
          working-directory: ${{ env.TF_WORKING_DIR }}

      ####################################################################
      # Terraform Plan
      ####################################################################

      - name: Terraform Plan
        if: steps.backend.outputs.exists == 'true'

        uses: ./.github/actions/terraform-plan

        with:
          working-directory: ${{ env.TF_WORKING_DIR }}
          tfvars-file: ${{ env.TF_VARS_FILE }}

          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      ####################################################################
      # Upload Logs
      ####################################################################

      - name: Upload Debug Logs

        if: always() && steps.backend.outputs.exists == 'true'

        uses: actions/upload-artifact@v4

        with:
          name: terraform-debug-logs

          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform

          retention-days: 3
          if-no-files-found: ignore

      ####################################################################
      # Step Summary
      ####################################################################

      - name: Pipeline Summary

        if: always()

        shell: bash

        run: |

          if [[ "${{ steps.backend.outputs.exists }}" == "true" ]]; then

            {
              echo "# Terraform Plan"

              echo ""

              echo "## Status"

              echo ""

              echo "Backend detected."

              echo ""

              echo "| Stage | Status |"
              echo "|------|--------|"
              echo "| Terraform Init | ✅ |"
              echo "| Terraform fmt | ✅ |"
              echo "| TFLint | ✅ |"
              echo "| Terraform Validate | ✅ |"
              echo "| Trivy | ✅ |"
              echo "| Terraform Plan | ✅ |"

            } >> "$GITHUB_STEP_SUMMARY"

          else

            {
              echo "# Terraform Plan"

              echo ""

              echo "## Status"

              echo ""

              echo "⚠️ Terraform backend bucket was not found."

              echo ""

              echo "Pipeline skipped because the remote backend does not exist."

              echo ""

              echo "This is expected if the environment has been destroyed."

            } >> "$GITHUB_STEP_SUMMARY"

          fi