name: Terraform Apply

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/actions/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: infrastructure/terraform
  TF_VARS_FILE: environments/uat.tfvars

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment:
      name: terraform-uat

    steps:
      ############################################################
      # Checkout Repository
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # Terraform Initialization
      ############################################################

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          aws-region: ${{ env.AWS_REGION }}
          working-directory: ${{ env.TF_WORKING_DIR }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      ############################################################
      # Terraform Validate
      ############################################################

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      ############################################################
      # Terraform Apply
      ############################################################

      - name: Terraform Apply
        uses: ./.github/actions/terraform-apply
        with:
          working-directory: ${{ env.TF_WORKING_DIR }}
          tfvars-file: ${{ env.TF_VARS_FILE }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      ############################################################
      # Upload Terraform Debug Logs
      ############################################################

      - name: Upload Terraform Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-debug
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          retention-days: 3
          if-no-files-found: ignore