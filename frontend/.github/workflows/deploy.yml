name: Deploy React App to GCP VM

on:
  push:
    branches: [ "qa" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PROJECT_ID: theshortlistd-production          
      ZONE: asia-southeast1-c              
      INSTANCE_NAME: shortlistd-prod-march-2026 
      REMOTE_APP_PATH: /var/www/html/nivasabid
      REMOTE_BACKUP_PATH: /home/raos_infosoftjoin/auction_site/bak/ui
      LOCAL_BUILD_DIR: dist

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Backup existing site on VM
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --command="
            sudo mkdir -p $REMOTE_BACKUP_PATH
            if [ -d $REMOTE_APP_PATH ]; then
              sudo tar -czf $REMOTE_BACKUP_PATH/employer-backup-\$(date +%Y%m%d-%H%M%S).tar.gz -C $REMOTE_APP_PATH .
            else
              echo 'WARNING: $REMOTE_APP_PATH does not exist, skipping backup.'
            fi
          "

      - name: Deploy new build to VM
        run: |
          # Stage build in /tmp
          gcloud compute scp --recurse $LOCAL_BUILD_DIR/* $INSTANCE_NAME:/tmp/nivasabid-build --zone=$ZONE
          
          # Move to final path with sudo
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --command="
            sudo mkdir -p $REMOTE_APP_PATH
            sudo rm -rf $REMOTE_APP_PATH/*
            sudo rsync -av /tmp/nivasabid-build/ $REMOTE_APP_PATH/
            sudo rm -rf /tmp/nivasabid-build
          "

      - name: Post-deploy verification
        run: |
          sleep 5
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "http://nivasabid.theshortlistd.org/")
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed with HTTP status $STATUS"
            exit 1
          fi
          echo "Deployment verified successfully."

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to last backup..."
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --command="
            LATEST_BACKUP=\$(ls -t $REMOTE_BACKUP_PATH/nivasabid-backup-*.tar.gz | head -n 1)
            if [ -z \"\$LATEST_BACKUP\" ]; then
              echo 'No backup found! Manual intervention required.'
              exit 1
            fi
            sudo rm -rf $REMOTE_APP_PATH/*
            sudo tar -xzf \$LATEST_BACKUP -C $REMOTE_APP_PATH
            echo 'Rollback completed.'
          "
