name: Terraform Plan

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: infrastructure/terraform
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
  TF_IN_AUTOMATION: true

concurrency:
  group: terraform-plan
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      #######################################################################
      # Checkout
      #######################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################################
      # AWS Credentials
      #######################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      #######################################################################
      # Terraform Setup
      #######################################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #######################################################################
      # TFLint Setup
      #######################################################################

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      #######################################################################
      # Formatting & Static Analysis
      #######################################################################

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Run TFLint
        run: tflint

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

      #######################################################################
      # Terraform Plugin Cache
      #######################################################################

      - name: Create Plugin Cache Directory
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infrastructure/terraform/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      #######################################################################
      # Terraform Init
      #######################################################################

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -no-color

      #######################################################################
      # Terraform Validate
      #######################################################################

      - name: Terraform Validate
        run: terraform validate -no-color

      #######################################################################
      # Terraform Plan
      #######################################################################

      - name: Terraform Plan
        env:
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -compact-warnings \
            -var-file=environments/uat.tfvars \
            -out=tfplan

      #######################################################################
      # Show Plan
      #######################################################################

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      #######################################################################
      # Export Plan
      #######################################################################

      - name: Export Terraform Plan
        run: terraform show -no-color tfplan > terraform-plan.txt

      #######################################################################
      # Upload Artifacts
      #######################################################################

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infrastructure/terraform/tfplan
            infrastructure/terraform/terraform-plan.txt