name: Terraform Plan

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: infrastructure/terraform
  TF_VARS_FILE: environments/uat.tfvars

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:

  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    timeout-minutes: 20

    ####################################################################
    # GitHub Environment
    ####################################################################

    environment:

      name: terraform-uat

    steps:

    ####################################################################
    # Terraform Initialization
    ####################################################################

    - name: Terraform Init
      uses: ./.github/actions/terraform-init

      with:

        aws-region: ${{ env.AWS_REGION }}

        working-directory: ${{ env.TF_WORKING_DIR }}

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    ####################################################################
    # Quality Checks
    ####################################################################

    - name: Terraform Quality

      uses: ./.github/actions/terraform-quality

      with:

        working-directory: ${{ env.TF_WORKING_DIR }}

    ####################################################################
    # Terraform Plan
    ####################################################################

    - name: Terraform Plan

      uses: ./.github/actions/terraform-plan

      with:

        working-directory: ${{ env.TF_WORKING_DIR }}

        tfvars-file: ${{ env.TF_VARS_FILE }}

        google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}

        google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

        jwt-secret: ${{ secrets.JWT_SECRET }}

    ####################################################################
    # Upload Logs
    ####################################################################

    - name: Upload Debug Logs

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: terraform-debug-logs

        path: |

          ${{ env.TF_WORKING_DIR }}/.terraform

        retention-days: 3

        if-no-files-found: ignore

    ####################################################################
    # GitHub Step Summary
    ####################################################################

    - name: Pipeline Summary

      if: always()

      shell: bash

      run: |

        {

          echo "# Terraform Plan Pipeline"

          echo ""

          echo "| Stage | Status |"

          echo "|------|--------|"

          echo "| Initialization | ✅ |"

          echo "| Terraform fmt | ✅ |"

          echo "| TFLint | ✅ |"

          echo "| Terraform Validate | ✅ |"

          echo "| Trivy Security Scan | ✅ |"

          echo "| Terraform Plan | ✅ |"

          echo ""

          echo "Artifacts"

          echo ""

          echo "- tfplan"

          echo "- terraform-plan.txt"

        } >> "$GITHUB_STEP_SUMMARY"