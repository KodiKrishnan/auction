name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: nivasabid-backend

jobs:

  #########################################################################
  # Backend Build & Push to Amazon ECR
  #########################################################################

  build-and-push:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      #####################################################################
      # Checkout Source
      #####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #####################################################################
      # Setup Java
      #####################################################################

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      #####################################################################
      # Build Spring Boot
      #####################################################################

      - name: Build Application
        run: mvn clean package -DskipTests

      #####################################################################
      # Configure AWS Credentials
      #####################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      #####################################################################
      # Login to Amazon ECR
      #####################################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #####################################################################
      # Generate Image Tags
      #####################################################################

      - name: Generate Image Tag
        id: image
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      #####################################################################
      # Build Docker Image
      #####################################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${IMAGE_TAG} \
            -t $ECR_REPOSITORY:latest \
            .

      #####################################################################
      # Tag Docker Image
      #####################################################################

      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:${IMAGE_TAG} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${IMAGE_TAG}

          docker tag $ECR_REPOSITORY:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      #####################################################################
      # Push Docker Images
      #####################################################################

      - name: Push Docker Images
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${IMAGE_TAG}
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      #####################################################################
      # Output Image URI
      #####################################################################

      - name: Image Information
        run: |
          echo "Image pushed successfully."
          echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${IMAGE_TAG}"
           #####################################################################
      # Save Image URI
      #####################################################################

      - name: Save Image URI
        run: |
          echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${IMAGE_TAG}" > image-uri.txt

      - name: Upload Image URI
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend/image-uri.txt
